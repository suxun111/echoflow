services:
  postgres:
    image: postgres:16-alpine
    container_name: echoflow-postgres
    environment:
      POSTGRES_DB: online_learning
      POSTGRES_USER: online_learning
      POSTGRES_PASSWORD: online_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_learning -d online_learning"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: echoflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: echoflow-minio
    environment:
      MINIO_ROOT_USER: online_learning
      MINIO_ROOT_PASSWORD: online_learning_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 online_learning online_learning_secret &&
        mc mb --ignore-existing local/online-learning

volumes:
  postgres-data:
  redis-data:
  minio-data:
